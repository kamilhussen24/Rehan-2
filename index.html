<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="REHAN DUBAI — Join Telegram">
    <meta property="og:description" content="প্রিমিয়াম টেলিগ্রাম কমিউনিটি">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Meta Pixel Code -->

    <style>
        :root{
            --blue:#229ED9;
            --blue-light:#37AEE2;
            --blue-dark:#1878a8;
            --green:#12a06b;
            --ink:#0b2136;
            --muted:#5f7488;
            --radius:18px;
            --ease:cubic-bezier(.22,1,.36,1);
        }

        *,*::before,*::after{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            -webkit-text-size-adjust:100%;
            text-size-adjust:100%;
        }

        body{
            min-height:100vh;
            min-height:100dvh;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            padding:
                calc(12px + env(safe-area-inset-top, 0px))
                16px
                calc(16px + env(safe-area-inset-bottom, 0px));
            background:linear-gradient(180deg,#e8f4fd 0%,#f1faf5 55%,#edf3f9 100%);
            background-attachment:fixed;
            font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
            color:var(--ink);
            line-height:1.5;
            overflow-x:hidden;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        .main{
            width:100%;
            max-width:440px;
            position:relative;
        }

        /* ===== স্ট্যাগার এন্ট্রি ===== */
        .main > *{
            animation:rise .55s var(--ease) both;
        }
        .main > *:nth-child(1){ animation-delay:.04s; }
        .main > *:nth-child(2){ animation-delay:.09s; }
        .main > *:nth-child(3){ animation-delay:.14s; }
        .main > *:nth-child(4){ animation-delay:.19s; }
        .main > *:nth-child(5){ animation-delay:.24s; }
        .main > *:nth-child(6){ animation-delay:.29s; }

        @keyframes rise{
            from{ opacity:0; transform:translateY(14px); }
            to{ opacity:1; transform:translateY(0); }
        }

        /* ===== হেডার ===== */
        .head{
            display:flex;
            align-items:center;
            gap:clamp(14px, 4vw, 18px);
            padding:2px 2px 0;
        }

        .logo-wrap{
            position:relative;
            width:clamp(56px, 15vw, 64px);
            height:clamp(56px, 15vw, 64px);
            flex-shrink:0;
        }

        .logo-ring{
            position:absolute;
            inset:0;
            border-radius:50%;
            border:2px solid rgba(34,158,217,.42);
            animation:ringPulse 2.8s ease-out infinite;
            will-change:transform,opacity;
        }
        .logo-ring:nth-child(2){ animation-delay:1.4s; }

        @keyframes ringPulse{
            0%{ transform:scale(.85); opacity:.85; }
            100%{ transform:scale(1.5); opacity:0; }
        }

        .tg-logo{
            position:absolute;
            inset:7px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:clamp(1.35rem, 4vw, 1.6rem);
            background:linear-gradient(140deg,#4cc0f0,#229ED9 55%,#1b86bd);
            box-shadow:
                0 14px 26px -12px rgba(34,158,217,.9),
                inset 0 -3px 8px rgba(0,0,0,.13);
            animation:bob 3.2s ease-in-out infinite;
            will-change:transform;
        }

        @keyframes bob{
            0%,100%{ transform:translateY(0); }
            50%{ transform:translateY(-5px); }
        }

        .head-text{
            text-align:left;
            min-width:0;
            flex:1;
        }

        .title{
            display:flex;
            align-items:center;
            gap:7px;
            font-size:clamp(1.25rem, 5vw, 1.6rem);
            font-weight:700;
            letter-spacing:.3px;
            line-height:1.2;
            white-space:nowrap;
        }
        .title span{
            background:linear-gradient(120deg,#0b2136 8%,#229ED9 55%,#12a06b 96%);
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            color:transparent;
        }
        .title i{
            font-size:.9em;
            color:var(--blue);
            flex-shrink:0;
        }

        .subtitle{
            margin-top:3px;
            font-size:clamp(.75rem, 2.8vw, .85rem);
            font-weight:500;
            color:var(--muted);
            line-height:1.35;
        }

        /* ===== মেম্বার ব্যাজ (উন্নত) ===== */
        .member-badge{
            display:inline-flex;
            align-items:center;
            gap:9px;
            margin:18px auto 0;
            padding:9px 20px;
            border-radius:999px;
            background:linear-gradient(135deg, rgba(34,158,217,.09), rgba(18,160,107,.09));
            border:1px solid rgba(34,158,217,.2);
            box-shadow:
                0 6px 18px -10px rgba(34,158,217,.55),
                inset 0 1px 0 rgba(255,255,255,.6);
            line-height:1;
            white-space:nowrap;
        }

        /* কেন্দ্রে বসানোর জন্য র‍্যাপার */
        .member-wrap{
            display:flex;
            justify-content:center;
        }

        .live-dot{
            position:relative;
            width:8px;
            height:8px;
            border-radius:50%;
            background:#12d07a;
            flex-shrink:0;
            box-shadow:0 0 0 0 rgba(18,208,122,.65);
            animation:live 1.9s ease-out infinite;
        }
        @keyframes live{
            0%{ box-shadow:0 0 0 0 rgba(18,208,122,.65); }
            70%{ box-shadow:0 0 0 9px rgba(18,208,122,0); }
            100%{ box-shadow:0 0 0 0 rgba(18,208,122,0); }
        }

        .member-count{
            font-size:clamp(.92rem, 3.4vw, 1.02rem);
            font-weight:700;
            color:#0b2136;
            letter-spacing:.2px;
            font-variant-numeric:tabular-nums;
        }

        .member-label{
            font-size:clamp(.72rem, 2.6vw, .8rem);
            font-weight:600;
            color:#5f7488;
            margin-left:-2px;
        }

        /* ===== হিন্ট ===== */
        .hint{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            margin:18px 0 8px;
            font-size:clamp(.72rem, 2.7vw, .78rem);
            font-weight:500;
            color:#7e92a4;
        }
        .hint i{
            color:var(--green);
            font-size:.95rem;
            animation:pointDown 1.3s ease-in-out infinite;
            will-change:transform;
        }
        @keyframes pointDown{
            0%,100%{ transform:translateY(-3px); }
            50%{ transform:translateY(3px); }
        }

        /* ===== CTA ===== */
        .cta-wrap{
            display:flex;
            justify-content:center;
        }

        .join-btn{
            position:relative;
            overflow:hidden;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:11px;
            width:100%;
            max-width:330px;
            min-height:52px;
            padding:15px 24px;
            border:none;
            border-radius:var(--radius);
            font-family:inherit;
            font-size:clamp(1.02rem, 3.9vw, 1.15rem);
            font-weight:700;
            color:#fff;
            text-decoration:none;
            cursor:pointer;
            touch-action:manipulation;
            -webkit-tap-highlight-color:transparent;
            background:linear-gradient(135deg,#37AEE2,#229ED9 50%,#1878a8);
            box-shadow:
                0 18px 32px -14px rgba(34,158,217,.95),
                inset 0 1px 0 rgba(255,255,255,.35);
            transition:transform .18s ease, box-shadow .18s ease;
            animation:btnPulse 2.3s ease-in-out infinite;
        }

        @keyframes btnPulse{
            0%{
                box-shadow:0 18px 32px -14px rgba(34,158,217,.95),
                           0 0 0 0 rgba(34,158,217,.45);
            }
            70%{
                box-shadow:0 18px 32px -14px rgba(34,158,217,.95),
                           0 0 0 15px rgba(34,158,217,0);
            }
            100%{
                box-shadow:0 18px 32px -14px rgba(34,158,217,.95),
                           0 0 0 0 rgba(34,158,217,0);
            }
        }

        .join-btn::after{
            content:'';
            position:absolute;
            top:-25%;
            left:-70%;
            width:45%;
            height:150%;
            background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
            transform:skewX(-22deg);
            animation:shine 3.6s ease-in-out infinite;
            pointer-events:none;
        }
        @keyframes shine{
            0%{ left:-70%; }
            55%{ left:135%; }
            100%{ left:135%; }
        }

        .join-btn:hover{ transform:translateY(-2px); }
        .join-btn:active{ transform:scale(.97); transition:.05s; }
        .join-btn:focus-visible{
            outline:3px solid rgba(34,158,217,.55);
            outline-offset:3px;
        }

        .btn-ic{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:32px;
            height:32px;
            border-radius:50%;
            font-size:1rem;
            background:rgba(255,255,255,.2);
            flex-shrink:0;
        }

        /* ===== ফিচার ===== */
        .features{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-top:22px;
        }

        .feat{
            display:flex;
            align-items:center;
            gap:11px;
            padding:13px 12px;
            border-radius:16px;
            background:rgba(255,255,255,.75);
            border:1px solid rgba(11,33,54,.06);
            transition:transform .2s ease, box-shadow .2s ease;
        }
        .feat:hover{
            transform:translateY(-3px);
            box-shadow:0 12px 24px -16px rgba(11,33,54,.5);
        }

        .feat i{
            display:flex;
            align-items:center;
            justify-content:center;
            width:clamp(32px, 9vw, 36px);
            height:clamp(32px, 9vw, 36px);
            border-radius:12px;
            font-size:clamp(.85rem, 3vw, .95rem);
            color:#fff;
            flex-shrink:0;
            background:linear-gradient(135deg,#37AEE2,#229ED9);
            box-shadow:0 9px 18px -9px rgba(34,158,217,.95);
        }
        .feat:nth-child(2) i{
            background:linear-gradient(135deg,#25c98a,#12a06b);
            box-shadow:0 9px 18px -9px rgba(18,160,107,.95);
        }
        .feat:nth-child(3) i{
            background:linear-gradient(135deg,#8b7cf6,#6a5ae0);
            box-shadow:0 9px 18px -9px rgba(106,90,224,.95);
        }
        .feat:nth-child(4) i{
            background:linear-gradient(135deg,#f9bd5c,#e79a1f);
            box-shadow:0 9px 18px -9px rgba(231,154,31,.95);
        }

        .feat span{
            font-size:clamp(.72rem, 2.7vw, .8rem);
            font-weight:600;
            color:#22405a;
            line-height:1.3;
            text-align:left;
        }

        /* ===== Ads By ===== */
        .ads-by{
            margin-top:18px;
            text-align:center;
            font-size:.74rem;
            font-weight:500;
            color:#8ba0b3;
        }
        .ads-by a{
            color:var(--blue);
            font-weight:700;
            text-decoration:none;
        }
        .ads-by a:hover{ text-decoration:underline; }
        .ads-by a:focus-visible{
            outline:2px solid rgba(34,158,217,.55);
            outline-offset:2px;
            border-radius:3px;
        }

        /* ===== ছোট ফোন (≤360px) ===== */
        @media (max-width:360px){
            body{ padding-left:12px; padding-right:12px; }
            .features{ gap:8px; }
            .feat{ padding:11px 9px; gap:9px; }
            .member-badge{ padding:8px 16px; gap:7px; }
        }

        /* ===== খুব ছোট (≤330px) ===== */
        @media (max-width:330px){
            .head{ gap:12px; }
            .title{ white-space:normal; }
            .feat span{ font-size:.7rem; }
        }

        /* ===== বড় স্ক্রিন (≥640px) ===== */
        @media (min-width:640px){
            body{ padding-top:26px; }
            .main{ max-width:460px; }
        }

        /* ===== অ্যাক্সেসিবিলিটি ===== */
        @media (prefers-reduced-motion: reduce){
            *,*::before,*::after{
                animation-duration:.001ms !important;
                animation-iteration-count:1 !important;
                transition-duration:.001ms !important;
                scroll-behavior:auto !important;
            }
        }
    </style>
</head>
<body>

<main class="main">

    <!-- ===== হেডার ===== -->
    <header class="head">
        <div class="logo-wrap" aria-hidden="true">
            <span class="logo-ring"></span>
            <span class="logo-ring"></span>

                <i class="fab fa-telegram-plane"></i>

        <div class="head-text">

    <!-- ===== মেম্বার ব্যাজ ===== -->

    <div class="member-wrap">

    <!-- ===== CTA ===== -->
    <div class="cta-wrap">
        <!-- 🔴 href-এ আসল Telegram invite link বসাও -->
        <a id="joinTelegramBtn"
           class="join-btn"
           href="https://t.me/+BQ7kFRByVFQ2MTM1"

        </a>

    <!-- ===== ফিচার ===== -->
    <div class="features">
        <div class="feat">
            <i class="fas fa-chart-line" aria-hidden="true"></i>
            <span>মার্কেট আপডেট</span>
        </div>
        <div class="feat">
            <i class="fas fa-clock" aria-hidden="true"></i>
            <span>২৪/৭ কমিউনিটি</span>
        </div>
        <div class="feat">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <span>প্রাইভেট গ্রুপ</span>
        </div>
        <div class="feat">
            <i class="fas fa-gem" aria-hidden="true"></i>
            <span>ডেইলি ডিসকাশন</span>
        </div>
    </div>

    <!-- ===== Ads By ===== -->
    <div class="ads-by">
        Ads By <a href="https://t.me/+mjeIPVeI4iAzYzNl" target="_blank" rel="noopener noreferrer">KDex</a>
    </div>

</main>

<script>
// 🔴 true = Purchase ইভেন্ট চালু, false = বন্ধ
const TRACK_PURCHASE = true;

(function () {
    const btn = document.getElementById('joinTelegramBtn');
    if (!btn) return;

    btn.addEventListener('click', function () {
        if (TRACK_PURCHASE && typeof fbq === 'function') {
            fbq('track', 'Purchase', {
                currency: 'BDT',
                value: 100
            });
        }
    }, { passive: true });
})();
</script>
